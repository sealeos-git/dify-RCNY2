# a.gzresources.com 站点 vhost（原 feasibility.conf，2026-10-14 拆分整理）
#
# 结构：
#   - 本文件：:80 入口（ACME 验证 / 企微域名验证 / mqtt-test ws / 其余 301 → https）
#             :443 入口（SSL 终结 + include sites/*.conf 引入各应用 location 片段）
#   - conf.d/sites/*.conf：按应用拆分（feasibility / sky-earth / map-apps / admin-pig）
#     注意：sites/ 子目录不会被 http 级 `include /etc/nginx/conf.d/*.conf` 自动加载，
#           必须由本文件显式 include；不要把 location 片段直接放 conf.d/（会被当成 http 级配置加载报错）。
#
# 变更流程：编辑 → docker exec docker-nginx-1 nginx -t → docker exec docker-nginx-1 nginx -s reload
# 仓库存档：deploy/docker-nginx/（手工同步）

# --- :80 HTTP：ACME + 验证 + 301 ---
server {
    listen 80;
    listen [::]:80;
    server_name a.gzresources.com;

    # 1. Let's Encrypt 验证路径 (必须保留，用于证书申请和续期)
    location ^~ /.well-known/acme-challenge/ {
        # 确保此路径与 Certbot 命令中的 -w 参数及 Docker 挂载路径一致
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # 2. 企微域名验证文件
    location = /WW_verify_rRKXBMoEIqpiovml.txt {
        root /tmp/wecom_verify;
    }

    # 3. mqtt-test websocket（:80 直连）
    location = /mqtt-test {
        proxy_pass http://172.23.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 4. 所有其他 HTTP 请求，全部 301 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- :443 HTTPS：SSL 终结 + 各应用路由 ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name a.gzresources.com;

    # SSL 证书配置（容器内路径 → 宿主机 volumes/certbot/conf，由 certbot deploy hook 同步）
    ssl_certificate /etc/letsencrypt/live/a.gzresources.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a.gzresources.com/privkey.pem;

    # 推荐的 SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 各应用 location 片段（前缀匹配与文件顺序无关，按最长前缀生效）
    include /etc/nginx/conf.d/sites/*.conf;
}