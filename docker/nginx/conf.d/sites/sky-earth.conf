# 空天地一体水生态监测平台（sky-earth-monitoring）
#   静态前端/登录应用：宿主机 nginx :5175（webroot /var/www/sky-earth-monitoring，前缀剥离）
#   业务后端：:8003（由宿主机 :5175 的 /api/ 再代理，见 /etc/nginx/conf.d/sky-earth-monitoring.conf）

# 空天地平台企微登录回调重定向
location /wecom-callback {
    return 302 https://$host/sky-earth-monitoring/wecom-callback$is_args$args;
}

# 空天地平台静态前端（前缀剥离 → :5175/）
location /sky-earth-monitoring/ {
    proxy_pass http://172.17.0.1:5175/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 空天地平台 API（长请求 / 流式）
location /sky-earth-monitoring/api/ {
    proxy_pass http://172.17.0.1:5175/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
}