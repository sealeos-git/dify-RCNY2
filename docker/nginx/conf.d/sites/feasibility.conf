# 可研系统（feasibility-chatbot）
#   收敛架构：所有流量统一经宿主机 nginx :8091，:8091 内部再反代 127.0.0.1:8000
#   → 后端 FastAPI :8000 仅绑定 127.0.0.1，docker 网桥/外网不可直达
#   注意：/admin/reports、/admin/logs 是前端路由；较长前缀自动优先于 admin-pig 的 /admin/

# 健康检查（后端）
location = /health {
    proxy_pass http://172.17.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# 前端静态资源（宿主机 nginx :8091，托管 /var/www/feasibility）
location / {
    proxy_pass http://172.17.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 后端 API（含 SSE 流式响应支持）
location /api/ {
    proxy_pass http://172.17.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

# 上传文件静态服务
location /uploads/ {
    proxy_pass http://172.17.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Feasibility 前端 admin 路由（报表 / 日志页）
location /admin/reports {
    proxy_pass http://172.17.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /admin/logs {
    proxy_pass http://172.17.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}